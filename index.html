<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👽 Oliver Tree 🛸</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background-color: #1b100c;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            color: white;

            /* FONDO DE OLIVER TREE */
            background:
                linear-gradient(
                    rgba(20, 12, 8, 0.35),
                    rgba(0, 0, 0, 0.65)
                ),
                url("oliver-tree.jpg") center center / cover fixed;

            font-family: Arial, sans-serif;
        }

        /* TÍTULO */
        h1 {
            text-align: center;
            margin-top: 45px;
            padding: 0 15px;
            color: #e6c49a;
            font-size: clamp(24px, 5vw, 40px);
            text-shadow: 0 0 15px #000;
        }

        p {
            text-align: center;
            color: #f1dfcc;
            padding: 0 15px;
        }

        /* CONTENEDOR DEL CUBO */
        .wrap {
            margin: 100px auto 120px;
            width: 200px;
            height: 200px;
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CUBO GIRATORIO */
        .cube {
            width: 200px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            animation: rotate 20s infinite linear;
        }

        @keyframes rotate {
            0% {
                transform: rotateX(-25deg) rotateY(0deg);
            }

            100% {
                transform: rotateX(335deg) rotateY(360deg);
            }
        }

        /* CARAS EXTERIORES */
        .cube > div {
            width: 200px;
            height: 200px;
            position: absolute;
            background: #33241c;
            border: 1px solid rgba(255, 225, 190, 0.7);
            opacity: 0.92;
            overflow: hidden;

            /* Abre y cierra automáticamente */
            animation-duration: 10s;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in-out;
        }

        .out-front {
            animation-name: frente;
        }

        .out-back {
            animation-name: atras;
        }

        .out-left {
            animation-name: izquierda;
        }

        .out-right {
            animation-name: derecha;
        }

        .out-top {
            animation-name: arriba;
        }

        .out-bottom {
            animation-name: abajo;
        }

        /*
          0%-50%: cerrado durante 5 segundos.
          50%-100%: abierto durante 5 segundos.
          Al terminar, vuelve a cerrarse.
        */

        @keyframes frente {
            0%, 49.9% {
                transform: translateZ(100px);
            }

            50%, 99.9% {
                transform: translateZ(200px);
            }

            100% {
                transform: translateZ(100px);
            }
        }

        @keyframes atras {
            0%, 49.9% {
                transform: translateZ(-100px) rotateY(180deg);
            }

            50%, 99.9% {
                transform: translateZ(-200px) rotateY(180deg);
            }

            100% {
                transform: translateZ(-100px) rotateY(180deg);
            }
        }

        @keyframes izquierda {
            0%, 49.9% {
                transform: translateX(-100px) rotateY(-90deg);
            }

            50%, 99.9% {
                transform: translateX(-200px) rotateY(-90deg);
            }

            100% {
                transform: translateX(-100px) rotateY(-90deg);
            }
        }

        @keyframes derecha {
            0%, 49.9% {
                transform: translateX(100px) rotateY(90deg);
            }

            50%, 99.9% {
                transform: translateX(200px) rotateY(90deg);
            }

            100% {
                transform: translateX(100px) rotateY(90deg);
            }
        }

        @keyframes arriba {
            0%, 49.9% {
                transform: translateY(-100px) rotateX(90deg);
            }

            50%, 99.9% {
                transform: translateY(-200px) rotateX(90deg);
            }

            100% {
                transform: translateY(-100px) rotateX(90deg);
            }
        }

        @keyframes abajo {
            0%, 49.9% {
                transform: translateY(100px) rotateX(-90deg);
            }

            50%, 99.9% {
                transform: translateY(200px) rotateX(-90deg);
            }

            100% {
                transform: translateY(100px) rotateX(-90deg);
            }
        }

        /* CARAS INTERIORES */
        .cube > span {
            display: block;
            width: 100px;
            height: 100px;
            position: absolute;
            top: 50px;
            left: 50px;
            background: #503a2c;
            border: 1px solid rgba(255, 225, 190, 0.7);
            overflow: hidden;
        }

        .in-front {
            transform: translateZ(50px);
        }

        .in-back {
            transform: translateZ(-50px) rotateY(180deg);
        }

        .in-left {
            transform: translateX(-50px) rotateY(-90deg);
        }

        .in-right {
            transform: translateX(50px) rotateY(90deg);
        }

        .in-top {
            transform: translateY(-50px) rotateX(90deg);
        }

        .in-bottom {
            transform: translateY(50px) rotateX(-90deg);
        }

        /* IMÁGENES */
        .cube img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* AJUSTES PARA CELULAR */
        @media (max-width: 500px) {
            .wrap {
                margin-top: 90px;
                transform: scale(0.85);
            }
        }
    </style>
</head>

<body>

    <!-- TUS TEXTOS ORIGINALES, CONSERVADOS -->
    <h1>꧁ 🛴 OLIVER TREE 🕊️ 👽 🛸 ꧂</h1>

    <p>No matter how strange you</p>
    <p>think you look no matter how</p>
    <p>ugly you feel you are beautiful</p>
    <p>- Oliver Tree 🕊️🛴</p>
    <p></p>

    <div class="wrap">
        <div class="cube">

            <!-- CARAS EXTERIORES -->
            <div class="out-front">
                <img src="image1.jpeg" alt="Oliver Tree 1">
            </div>

            <div class="out-back">
                <img src="image2.jpeg" alt="Oliver Tree 2">
            </div>

            <div class="out-left">
                <img src="image3.jpeg" alt="Oliver Tree 3">
            </div>

            <div class="out-right">
                <img src="image4.jpeg" alt="Oliver Tree 4">
            </div>

            <div class="out-top">
                <img src="image5.jpeg" alt="Oliver Tree 5">
            </div>

            <div class="out-bottom">
                <img src="image6.jpeg" alt="Oliver Tree 6">
            </div>

            <!-- CARAS INTERIORES -->
            <span class="in-front">
                <img src="image7.jpeg" alt="Oliver Tree 7">
            </span>

            <span class="in-back">
                <img src="image8.jpeg" alt="Oliver Tree 8">
            </span>

            <span class="in-left">
                <img src="image9.jpeg" alt="Oliver Tree 9">
            </span>

            <span class="in-right">
                <img src="image10.jpeg" alt="Oliver Tree 10">
            </span>

            <span class="in-top">
                <img src="image11.jpeg" alt="Oliver Tree 11">
            </span>

            <span class="in-bottom">
                <img src="image12.jpeg" alt="Oliver Tree 12">
            </span>

        </div>
    </div>

</body>
</html>
